name: "ok-LimbusCompanyTool"
uac: true
icon: "icons/icon.png"
profiles:
  - name: "Global"
    git_url: "https://github.com/howhowdy2/ok-LimbusCompanyTool.git"
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true

  - name: "Web"
    main_script: "web_main.py"
    requires_python: "3.12"
    requirements: "requirements-web.txt"
    pip_args: "--no-deps"
    use_pythonw: true
